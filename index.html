<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KBANZ LOADING SCREEN</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ============ BACKGROUND MUSIC VIDEO (plays behind all filters) ============ -->
    <div class="bg-stage">
        <video id="bgVideo" class="bg-video" playsinline webkit-playsinline preload="metadata"></video>
    </div>

    <!-- ============ CINEMATIC FILTERS / OVERLAYS ============ -->
    <div class="filters">
        <div class="filter-tint"></div>
        <div class="filter-spotlight"></div>
        <div class="filter-vignette"></div>
        <div class="filter-bottom"></div>
    </div>

    <!-- ============ FAINT BACKDROP WATERMARK ============ -->
    <img class="watermark" id="watermarkLogo" alt="" />

    <!-- ============ TOP-RIGHT AUDIO CONTROL ============ -->
    <header class="topbar">
        <div class="topbar-right">
            <div class="mute-indicator" id="muteIndicator">
                <svg id="iconSound" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
                <svg id="iconMuted" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
                <span id="muteLabel">Mute</span>
            </div>
            <span class="space-key" id="spaceKey">SPACE</span>
        </div>
    </header>


    <aside class="staff-panel" id="staffPanel">
        <div class="staff-kicker" id="staffKicker">COMMUNITY</div>
        <div class="staff-heading" id="staffHeading">STAFF TEAM</div>
        <div class="staff-list" id="staffList"></div>
    </aside>

    <!-- ============ CENTER LOGO ============ -->
    <main class="stage">
        <img class="brand-logo" id="brandLogo" alt="" />
    </main>

    <!-- ============ BOTTOM LOADING BAR ============ -->
    <div class="loadbar">
        <div class="loadbar-track"><div class="loadbar-fill" id="loadbarFill"></div></div>
    </div>

    <!-- ============ NOW PLAYING TOAST (shows on track change) ============ -->
    <div class="np-toast" id="npToast">
        <div class="np-toast-bars"><span></span><span></span><span></span><span></span></div>
        <div class="np-toast-text">
            <div class="np-toast-title" id="toastTitle">--</div>
            <div class="np-toast-artist" id="toastArtist">--</div>
        </div>
    </div>

    <!-- ============ MEDIA PLAYER (bottom-center toggle, hidden panel) ============ -->
    <div class="player-toggle" id="playerToggle" title="Show media controls">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span>Media Controls</span>
    </div>

    <section class="player" id="player">
        <div class="player-head">
            <div class="player-head-title">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
                Media Player
            </div>
            <button class="player-close" id="playerClose" title="Hide">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="player-art">
            <div class="eq" id="eq"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        </div>

        <div class="player-vis" id="playerVis"></div>

        <div class="player-now">
            <div class="player-track" id="playerTitle">--</div>
            <div class="player-artist" id="playerArtist">--</div>
        </div>

        <div class="player-progress">
            <div class="player-bar" id="progressBar"><div class="player-bar-fill" id="progressFill"></div></div>
            <div class="player-time"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
        </div>

        <div class="player-controls">
            <button class="ctrl" id="prevBtn" title="Previous (←)">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="ctrl ctrl-play" id="playBtn" title="Play / Pause">
                <svg id="iconPlay" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
                <svg id="iconPause" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
            </button>
            <button class="ctrl" id="nextBtn" title="Next (→)">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
            </button>
            <button class="ctrl ctrl-mute" id="muteBtn" title="Mute (Space)">
                <svg id="pIconSound" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <svg id="pIconMuted" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
            </button>
        </div>

        <div class="player-volume">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            </svg>
            <input type="range" id="volume" min="0" max="100" value="70" />
        </div>

        <div class="player-list" id="playlist"></div>
    </section>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
